# Builds the Windows app on GitHub's servers and publishes it as a Release.
# Runs when the app changes on main, or by hand (Actions > Build LMP release > Run workflow).
name: Build LMP release

on:
  push:
    branches: [main]
    paths: ['app/**', 'presets/**', 'source/src/version.ts', 'tools/seticon.mjs', 'tools/package.json', 'notes/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  ELECTRON_VERSION: '33.2.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read version
        id: ver
        run: |
          V=$(grep -oP "VERSION = '\K[0-9.]+" source/src/version.ts)
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "LMP version $V"

      - name: Download Electron
        run: |
          curl -fsSL -o electron.zip "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-win32-x64.zip"
          mkdir -p build/LMP
          unzip -q electron.zip -d build/LMP

      - name: Put LMP together
        run: |
          L=build/LMP
          mv "$L/electron.exe" "$L/LMP.exe"
          rm -f "$L/resources/default_app.asar"
          mkdir -p "$L/resources/app" "$L/licenses"
          cp app/* "$L/resources/app/"
          mv "$L/LICENSE" "$L/licenses/LICENSE-Electron.txt"
          mv "$L/LICENSES.chromium.html" "$L/licenses/LICENSES-Chromium.html"
          cp licenses/* "$L/licenses/"
          cp lmp.ico lmp-file.ico README.md "$L/"
          cp -r presets "$L/presets"
          # The scanned-materials catalog, so the shelf shows them even before LMP goes online.
          curl -sfL -o "$L/presets/materials-catalog.json" "https://github.com/$GITHUB_REPOSITORY/releases/download/materials/materials-catalog.json" || echo "no materials catalog yet"
          cp -r source "$L/source"

      - name: Set the LMP icon and file info (owned by H9_zy)
        run: |
          cd tools && npm ci --silent && cd ..
          node tools/seticon.mjs build/LMP/LMP.exe lmp.ico build/LMP/LMP.exe "${{ steps.ver.outputs.v }}"

      - name: Zip
        run: |
          V="${{ steps.ver.outputs.v }}"
          cd build
          zip -qr -9 "../LMP-v$V.zip" LMP
          zip -qr -9 "../LMP-v$V-update.zip" LMP/resources/app LMP/README.md LMP/source
          cd ..
          ls -lh LMP-v*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.v }}"
          {
            echo "## Download"
            echo
            echo "**[Download LMP-v$V.zip](https://github.com/$GITHUB_REPOSITORY/releases/download/v$V/LMP-v$V.zip)** is the whole program (Windows 10/11, 64-bit). Extract it anywhere, for example D:\\LMP, and open LMP.exe. Nothing needs installing."
            echo
            echo "Already using LMP 1.02 or newer? You don't need to download anything. LMP tells you about this update and installs it when you click Update now."
            echo
            echo "LMP-v$V-update.zip is only for updating LMP 1.01 or older by hand: extract it into the folder that holds your LMP folder."
            echo
            echo "## What's new"
            echo
            if [ -f "notes/v$V.md" ]; then cat "notes/v$V.md"; fi
          } > release-notes.md
          cat release-notes.md
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release delete "v$V" --cleanup-tag --yes
          fi
          gh release create "v$V" "LMP-v$V.zip" "LMP-v$V-update.zip" --target "$GITHUB_SHA" --title "LMP v$V" --notes-file release-notes.md --latest
